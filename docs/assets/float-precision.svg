<svg xmlns="http://www.w3.org/2000/svg" width="940" height="286" viewBox="0 0 940 286" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">
<rect width="940" height="286" fill="#ffffff"/>
<text x="260" y="38" font-size="22" font-weight="700" fill="#111">32 比特下的精度（十进制有效位）</text>
<text x="260" y="64" font-size="14" fill="#666">越高越好；动态范围是用这里换来的</text>
<text x="246" y="113" text-anchor="end" font-size="14" fill="#222">IEEE single</text>
<rect x="260" y="92" width="530" height="30" rx="4" fill="#8a8f98"/>
<text x="800" y="113" font-size="14" font-weight="600" fill="#111">6.92</text>
<text x="246" y="159" text-anchor="end" font-size="14" fill="#222">三值 · 匹配尾数位</text>
<rect x="260" y="138" width="512" height="30" rx="4" fill="#1f7a4d"/>
<text x="782" y="159" font-size="14" font-weight="600" fill="#111">6.68</text>
<text x="246" y="205" text-anchor="end" font-size="14" fill="#222">三值 · 匹配指数位</text>
<rect x="260" y="184" width="439" height="30" rx="4" fill="#b3541e"/>
<text x="709" y="205" font-size="14" font-weight="600" fill="#111">5.73</text>
<text x="260" y="268" font-size="12" fill="#777">来源同上；三值误差上界 3^{1-p}，折算成十进制位数 (p-1)·log10 3</text>
</svg>
