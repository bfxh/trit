[package]
name = "trit-net"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "三值权重网络实验层：{-1,0,+1} 权重 + X 输入 + 确定/弃权解析（不属于稳定 API）"
publish = false

[dependencies]
trit-core.workspace = true
serde = { version = "1.0.229", features = ["derive"] }
thiserror = "2.0.21"
serde_json = "1.0.154"

[[bench]]
name = "net"
harness = false

[dev-dependencies]
# 仅测试用：trit-net Model 与 TTX MOD 容器的兼容对拍（发布图门允许 dev-deps）。
trit-texture = { path = "../trit-texture" }
