[package]
name = "trit-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "trit 命令行：求值、真值表、等价判定、化简与网表分析"

[[bin]]
name = "trit"
path = "src/main.rs"

[dependencies]
trit-core.workspace = true
trit-capacity.workspace = true
trit-eval.workspace = true
trit-sat.workspace = true
trit-circuit.workspace = true
trit-bdd.workspace = true
trit-policy.workspace = true
trit-belnap.workspace = true
trit-schedule.workspace = true
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

[dev-dependencies]
serde_json = "1.0.154"
