[package]
name = "trit-parts"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "部件平面头（k 位三进制 + valid）的 Rust 三进制 GPU 实现（不属于稳定 API）"
publish = false

[features]
default = []
gpu = ["dep:wgpu", "dep:pollster", "dep:bytemuck"]

[dependencies]
wgpu = { version = "30", optional = true }
pollster = { version = "0.4", optional = true }
bytemuck = { version = "1", features = ["derive"], optional = true }
# STE / 量化口径的唯一来源（与 trit-train 共用，不另立一套）。
trit-train = { path = "../trit-train" }
# 训练数据是 PNG（384² RGB）；纯 Rust 解码，不借 Python。
png = "0.17"

[[bin]]
name = "parts-parity"
path = "src/bin/parts_parity.rs"
required-features = ["gpu"]

[[bin]]
name = "parts-gradcheck"
path = "src/bin/parts_gradcheck.rs"
required-features = ["gpu"]

[[bin]]
name = "parts-train"
path = "src/bin/parts_train.rs"
required-features = ["gpu"]
