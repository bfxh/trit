[package]
name = "trit-clean"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "三值约束检查 + 精确修复计数（数据清洗 M0）"

[dependencies]
trit-core.workspace = true
trit-count.workspace = true
biodivine-lib-bdd = "0.6.3"
thiserror = "2.0.21"

[dev-dependencies]
# 三值语义对拍用真 SQLite（bundled 随 crate 编译，三平台一致）。
# 0.41 需要 rustc 1.89；本仓 MSRV 随之上调到 1.89（libsqlite3-sys 0.39.1 修复
# RUSTSEC-2026-0459 的 C SQLite CVE，0.39 仍带漏洞版本）。
rusqlite = { version = "=0.41.0", features = ["bundled"] }
