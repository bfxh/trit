[package]
name = "trit-gpu"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "三值点积的 GPU 实现（WGSL countOneBits）与 CPU 位并行对照（不属于稳定 API）"
publish = false

[features]
default = []
gpu = ["dep:wgpu", "dep:pollster", "dep:bytemuck", "dep:half"]

[dependencies]
serde_json = "1.0.154"
wgpu = { version = "30", optional = true }
pollster = { version = "0.4", optional = true }
bytemuck = { version = "1", features = ["derive"], optional = true }
half = { version = "2", optional = true }

[[example]]
name = "ttx_render_gpu"
required-features = ["gpu"]

[[example]]
name = "render_scene_gpu"
required-features = ["gpu"]

[[example]]
name = "wspace_gpu"
required-features = ["gpu"]

[[example]]
name = "wf32_bench"
required-features = ["gpu"]

[[example]]
name = "device_calibrate"
required-features = ["gpu"]

[[bench]]
name = "sample"
harness = false
required-features = ["gpu"]

[dev-dependencies]
trit-wspace = { path = "../trit-wspace" }
# 仅测试/示例用：GPU 侧与 trit-texture 的 CPU 参考对拍、出图示例读 TTX
#（发布图门允许 dev-deps：`cargo package` 会剥离 path dev-deps）。
trit-texture = { path = "../trit-texture", features = ["png"] }
# 设备适配沙盘：确定性随机源 + 仓内 QAT 策略。
trit-bench.workspace = true
trit-learn.workspace = true
# 真实设备校准：显存探针 + CPU SIMD 吞吐 + 档案序列化。
trit-capacity.workspace = true
trit-simd = { path = "../trit-simd" }
serde = { version = "1.0.229", features = ["derive"] }
