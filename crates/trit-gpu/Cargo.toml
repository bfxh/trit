[package]
name = "trit-gpu"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "三值点积的 GPU 实现（WGSL countOneBits）与 CPU 位并行对照（不属于稳定 API）"
publish = false

[features]
default = []
gpu = ["dep:wgpu", "dep:pollster", "dep:bytemuck", "dep:half"]

[dependencies]
serde_json = "1.0.154"
wgpu = { version = "30", optional = true }
pollster = { version = "0.4", optional = true }
bytemuck = { version = "1", features = ["derive"], optional = true }
half = { version = "2", optional = true }

[[bench]]
name = "sample"
harness = false
required-features = ["gpu"]

[dev-dependencies]
# 仅测试用：GPU 解码与 trit-texture 的 CPU 解码逐字节对拍（发布图门允许 dev-deps）。
trit-texture = { path = "../trit-texture" }
