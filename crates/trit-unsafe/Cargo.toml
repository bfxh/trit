[package]
name = "trit-unsafe"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "用三值逻辑（K3）审 unsafe：每个点判 Safe/Unknown/Risky 并按 crate 合成"
publish = false

[[bin]]
name = "trit-unsafe"
path = "src/main.rs"

[dependencies]
trit-core.workspace = true
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
serde_json = "1.0.154"
