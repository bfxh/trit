name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  guard:
    name: tag matches version
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Release tooling self-test
        run: |
          python scripts/release_preflight.py --self-test
          python scripts/release.py --self-test

      - name: Tag must equal trit-cli version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          version="$(cargo metadata --no-deps --format-version 1 --locked \
            | jq -r '.packages[] | select(.name == "trit-cli") | .version')"
          echo "tag=${tag} trit-cli=${version}"
          test "${tag}" = "${version}"

  # Developer-only quality gate.  It must pass before a release build starts,
  # but its receipt and test fixtures are never uploaded as release assets.
  agent-quality:
    name: agent quality (work-bench + PTC)
    needs: guard
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Install native XLSX dependency
        run: python -m pip install "openpyxl==3.1.5"

      - name: Agent quality gate
        run: python scripts/agent_quality_gate.py --out artifacts/agent-quality-gate.json

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: agent-quality-evidence
          path: artifacts/
          if-no-files-found: warn
          retention-days: 7

  build:
    name: build (${{ matrix.asset }})
    needs: [guard, agent-quality]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            asset: trit-linux-x86_64
            ext: ""
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            asset: trit-windows-x86_64
            ext: ".exe"
          - os: macos-latest
            target: aarch64-apple-darwin
            asset: trit-macos-aarch64
            ext: ""
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      # 产物里别带构建机路径：Rust std 的 panic/diagnostic 会嵌 `$HOME\.rustup\...`（含用户名）。
      - name: Remap build paths (unix)
        if: runner.os != 'Windows'
        run: echo "RUSTFLAGS=--remap-path-prefix=$HOME=~" >> "$GITHUB_ENV"

      - name: Remap build paths (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: '"RUSTFLAGS=--remap-path-prefix=$env:USERPROFILE=~" | Out-File -FilePath $env:GITHUB_ENV -Append'

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Test (host)
        run: cargo test --workspace --locked

      - name: Smoke
        shell: bash
        run: |
          "target/${{ matrix.target }}/release/trit${{ matrix.ext }}" --version

      - name: Package (unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/trit${{ matrix.ext }}" "dist/${{ matrix.asset }}"
          tar -czf "dist/${{ matrix.asset }}.tar.gz" -C dist "${{ matrix.asset }}"
          rm "dist/${{ matrix.asset }}"

      - name: Package (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/trit.exe" "dist/${{ matrix.asset }}.exe"
          Compress-Archive -Path "dist/${{ matrix.asset }}.exe" -DestinationPath "dist/${{ matrix.asset }}.zip"
          Remove-Item "dist/${{ matrix.asset }}.exe"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ matrix.asset }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  release:
    name: publish
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      # Only the three trit-* binary archives are user-facing release assets.
      # agent-quality-evidence is deliberately excluded: receipts, fixture
      # names and internal command output stay on the CI run page.
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: dist
          pattern: trit-*
          merge-multiple: true

      - name: Checksums
        run: cd dist && sha256sum * > SHA256SUMS

      - name: Upload release assets
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: dist/*
          generate_release_notes: true
