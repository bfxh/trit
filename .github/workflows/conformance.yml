name: conformance

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "interop/**"
      - "other-languages/go/**"
      - "other-languages/asm/**"
      - "other-languages/asm-arm64/**"
      - ".github/workflows/conformance.yml"

permissions:
  contents: read

concurrency:
  group: conformance-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  runner:
    name: interop runner (738 vectors)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - name: Run conformance runner
        run: cd interop/runner && cargo run --release

  go:
    name: go conformance
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Run Go tests (includes golden vectors)
        run: cd other-languages/go && go test ./...

  asm:
    name: asm conformance (K3/Belnap4/pack5)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - name: Run asm conformance
        run: cd other-languages/asm && cargo run --release -- --conformance

  arm64-neon:
    name: arm64 neon (ubuntu-24.04-arm)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - name: Run NEON correctness + benchmark
        run: |
          uname -m
          cd other-languages/asm-arm64 && cargo run --release

  avx512:
    name: avx512 probe
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - name: Probe CPU and run AVX-512 path
        run: |
          if grep -qm1 avx512f /proc/cpuinfo; then
            cd other-languages/asm && cargo run --release -- --avx512
          else
            echo "AVX512_AVAILABLE=false (runner lacks avx512f)"
          fi

  lean:
    name: lean 4 semantics
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: leanprover/lean-action@ba3fdfe5c4476c925da13bf11a005ddb47e47aee # v1
        with:
          lake-package-directory: interop/lean
          auto-config: "false"
          build: "true"
          test: "false"
          lint: "false"
          use-mathlib-cache: "false"
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - name: Generate Lean conformance output
        run: cd interop/lean && lake exe tritLean > /tmp/lean-vectors.jsonl
      - name: Compare Lean output with golden vectors
        run: cd interop/runner && cargo run --release -- --lean /tmp/lean-vectors.jsonl
