name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  CARGO_INCREMENTAL: 0

jobs:
  check:
    name: fmt + clippy + test
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      # macOS 按 10×、Windows 按 2× 计费，但 #147 的事故证明「PR 不跑 macOS ⇒
      # 合入后 main 才红」的代价更高：aarch64 缺实现只能在 macOS 上暴露。
      # 三个 OS 都跑，PR 与 main 同矩阵。
      matrix:
        os: ["ubuntu-latest", "windows-latest", "macos-latest"]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Test
        run: cargo test --workspace --locked

      # png feature（默认关）：单独测 + clippy，否则 CI 永远碰不到这些代码。
      - name: Test (trit-texture png feature)
        run: cargo test -p trit-texture --features png --locked
      - name: Clippy (trit-texture png feature)
        run: cargo clippy -p trit-texture --features png --all-targets --locked -- -D warnings

      # gpu feature（默认关）：同上。#149 的事故就是这块代码从没被门编译过
      # （matmul.rs 在内核 feature 后，PR 绿、main 的 macOS 红）。
      #
      # 只跑 1×1×1 冒烟用例：CI 的软件后端（Windows WARP 等）跑完整 matmul
      # （512×4096×512）要十几分钟；而 1×1×1 同样会创建全部 shader module，
      # f16 扩展缺失这类错照样能抓到。完整形状在开发者本机跑。
      - name: Test (trit-gpu gpu feature, shader smoke)
        run: cargo test -p trit-gpu --features gpu --locked --test matmul gpu_reg_matmul_tiny_case
      - name: Clippy (trit-gpu gpu feature)
        run: cargo clippy -p trit-gpu --features gpu --all-targets --locked -- -D warnings

  module-budget:
    name: module budget (god objects)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Gate self-test (positive + counterexamples)
        run: python3 scripts/module_budget.py --self-test
      - name: Every file within budget (default ratchet, whole repo)
        run: python3 scripts/module_budget.py
      - name: Disk guard self-test (signal merge + size classes)
        run: python3 scripts/disk_guard.py --self-test
      # 观测轮：虚拟化层会把固态报成机械盘（WSL2 的 /dev/sdd 实测 rotational=1），
      # runner 上报什么还没有证据 ⇒ 先只打印读数，拿到一轮真实结果再改成阻塞。
      - name: Disk guard (build/test scratch off spinning disks)
        run: python3 scripts/disk_guard.py --json
        continue-on-error: true

  hazard:
    name: hazard gate (concurrency/memory)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Gate self-test (positive + counterexamples)
        run: python3 scripts/hazard_gate.py --self-test
      - name: Concurrency/memory hazards within the design policy
        run: python3 scripts/hazard_gate.py

  mutation-gate:
    name: mutation gate (self-test)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      # 门的判定链自身也要有人盯：编译红当抓住、崩溃当断言、脚本落 cargo、空集放行
      - name: Gate self-test (verdicts / runner inference / empty selection)
        run: python3 scripts/mutation_check.py --self-test

  snapshot:
    name: snapshot (self-test)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      # 回退底座按字节还原、dry-run 不改文件、不清新文件、对象被篡改要报错
      - name: Snapshot self-test (save / verify / restore / prune)
        run: python3 scripts/snapshot.py --self-test
      # 一条命令 = 先快照、失败自动回退（含删掉命令新建的文件）
      - name: Autoflow self-test (run / auto-restore / keep-on-fail)
        run: python3 scripts/autoflow.py --self-test
      # 一句话提交 GitHub：密钥/敏感文件拒收、显式点名文件、dry-run 只打印
      - name: Gitflow self-test (secret scan / explicit files / dry-run plan)
        run: python3 scripts/gitflow.py --self-test

  deps:
    name: deps plan (self-test)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      # 「能不能整块摘出去」的判据：继承字段 / 内部依赖 / 内部 dev / 越界引用 / build.rs
      - name: Dependency detach self-test
        run: python3 scripts/deps.py --self-test

  vendor:
    name: vendor (self-test)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      # 离线自足开关的配置拼接/还原：重复 save 不重复插段、restore 优先按备份、备份只做一次
      - name: Vendor config splice self-test
        run: python3 scripts/vendor.py --self-test

  secret-scan:
    name: secret scan (repo-wide)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Self-test (patterns / binary skip / allow marker)
        run: python3 scripts/secret_scan.py --self-test
      # 与 GitHub push protection 互补：合成夹具用 `secret-scan: allow` 显式豁免
      - name: Scan repository for high-confidence secrets
        run: python3 scripts/secret_scan.py

  ci-integrity:
    name: ci integrity (protection ↔ workflows)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Self-test (typo / push-only / if-guard)
        run: python3 scripts/ci_integrity.py --self-test
      # 拼错的必需检查 = 永久卡死；只在 push 触发的 job 设成必需 = PR 永远等不到
      - name: Required checks match workflow jobs
        run: python3 scripts/ci_integrity.py

  surface:
    name: test surface (ratchet)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      # 每条规则都要有真的会红的反证：空壳 #[test]、裸 #[ignore]、空 self_test、棘轮
      - name: Self-test (hollow tests / bare ignore / ratchet)
        run: python3 scripts/test_surface.py --self-test
      # 台账棘轮：删测试不会让任何别的手段变红，所以在这里拦
      - name: Repo test surface
        run: python3 scripts/test_surface.py
      # 绿即合之前的证据审计：必需检查 skipped / 压根没上报 / run 里 0 个 job 都判红
      - name: Green audit self-test (execution evidence)
        run: python3 scripts/green_audit.py --self-test

  forensics:
    name: merge forensics (self-test)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      # 夹具现造真仓库真冲突：整块取一边、文件没了、算不出 merge-base 都要判红
      - name: Merge forensics self-test (dropped side / vanished file)
        run: python3 scripts/merge_forensics.py --self-test

  stress:
    name: stress (high pressure invariants)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: Extreme vectors, word boundaries, large random payloads
        run: cargo test --release --locked -p trit-dot -p trit-codec -p trit-float -p trit-gpu --tests

  publish-graph:
    name: publish graph (no dep on unpublished crates)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Gate self-test (positive + counterexamples)
        run: python3 scripts/publish_graph.py --self-test
      - name: Dependency direction and publish metadata
        run: python3 scripts/publish_graph.py

  docs:
    name: docs (rustdoc -D warnings)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: Rustdoc
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --no-deps --locked

  action:
    name: action (self-test)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Run the reusable action against the example policy
        uses: ./action
        with:
          policy: examples/policy.json
          engine: sat

  msrv:
    name: MSRV (1.88)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: dtolnay/rust-toolchain@360a4e93673de6630fac2478bc9e35244b01a759 # 1.88
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - run: cargo build --workspace --locked
      - run: cargo test --workspace --locked

  package:
    name: package (publishable)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: Package every crate (no build)
        run: cargo package --workspace --no-verify --locked

  wasm:
    name: wasm (wasm32 build)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - run: cargo build -p trit-wasm --target wasm32-unknown-unknown --locked
