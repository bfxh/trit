name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  CARGO_INCREMENTAL: 0

jobs:
  check:
    name: fmt + clippy + test
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      # macOS 按 10×、Windows 按 2× 计费，但 #147 的事故证明「PR 不跑 macOS ⇒
      # 合入后 main 才红」的代价更高：aarch64 缺实现只能在 macOS 上暴露。
      # 三个 OS 都跑，PR 与 main 同矩阵。
      matrix:
        os: ["ubuntu-latest", "windows-latest", "macos-latest"]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0

      # 输出键名沿用 `only_docs`（14 处 if 条件不用改），语义已扩为「改动集不含 Rust 面」：
      # 文档之外，scripts/、.github/、sweeps/、tests/（仅夹具）不参与 Rust 编译；
      # other-languages/、benchmarks/ 不在主 workspace；t3/ 是独立 workspace（t3.yml 自跑）。
      # 证据：只改脚本的 PR（如 #238）Windows job 12m（Test 240s + GPU 冒烟编译 372s）全花在
      # 重编未变的 Rust 代码上；门族 job 不在此 job，照常全跑。
      - name: Detect no-Rust change set (PR only)
        id: scope
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT" != "pull_request" ]; then
            echo "only_docs=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -z "${BASE_SHA:-}" ]; then
            echo "only_docs=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          files=$(git diff --name-only "$BASE_SHA"...HEAD || true)
          if [ -z "$files" ]; then
            echo "only_docs=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if printf '%s\n' "$files" | grep -Ev '^(docs/|scripts/|\.github/|sweeps/|tests/|other-languages/|benchmarks/|t3/|.*\.md$|README|LICENSE|CHANGELOG)' | grep -q .; then
            echo "only_docs=false" >> "$GITHUB_OUTPUT"
          else
            echo "only_docs=true" >> "$GITHUB_OUTPUT"
          fi
          echo "changed files:"; printf '%s\n' "$files" | head -50

      - name: Install Rust
        if: steps.scope.outputs.only_docs != 'true'
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: rustfmt, clippy

      # 编译缓存：GHA 后端，跨 run 复用编译产物（与 rust-cache 互补：
      # 后者恢复 target 目录，前者在 target 缓存被淘汰/换 feature 组合时仍能命中）。
      # CARGO_INCREMENTAL=0 已在 job env，sccache 需要它才能缓存。
      - name: sccache（GHA 后端）
        if: steps.scope.outputs.only_docs != 'true'
        uses: mozilla-actions/sccache-action@d651010b8da762cde178750d8eda7b5febfe147a # v0.0.9
        with:
          version: "v0.19.0"

      # 测试执行并行：cargo test 是一个测试二进制一个二进制串行跑，nextest 跨二进制调度。
      # 版本钉死，避免 CI 随上游漂移。
      - name: Install cargo-nextest
        if: steps.scope.outputs.only_docs != 'true'
        uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: nextest@0.9.148

      # rust-cache 的键只哈希依赖（Cargo.lock 与各 Cargo.toml 的依赖段），不含 [profile]：改了 profile，
      # 旧 target 里的产物全部作废，却仍会 full match 恢复、且因「键已存在」不再保存，之后每次都
      # 整仓重编。把根 Cargo.toml 的哈希并进键，profile 一改缓存就换代。本文件与 mutation.yml 里的
      # rust-cache 都带这一行。
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        if: steps.scope.outputs.only_docs != 'true'
        with:
          key: ${{ hashFiles('Cargo.toml') }}

      # 收窄判据本身要有人盯：它坏了不能悄悄把整条测试面关掉。
      - name: Scope self-test (ci_scope)
        if: steps.scope.outputs.only_docs != 'true'
        run: python3 scripts/ci_scope.py --self-test

      # 编译/测试面按「直改 crate + 反向依赖闭包」收窄（scripts/ci_scope.py）。
      # 拿不到依赖图就退回全量：full 永远是安全方向。
      - name: Scope crates (PR only)
        id: crates
        if: steps.scope.outputs.only_docs != 'true'
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -uo pipefail
          fallback() {
            {
              echo "args="
              echo "needs_png=true"
              echo "needs_gpu=true"
              echo "needs_build_gpu=true"
              echo "reason=$1"
            } >> "$GITHUB_OUTPUT"
            echo "收窄不可用，走全量：$1"
          }
          if [ "$EVENT" != "pull_request" ] || [ -z "${BASE_SHA:-}" ]; then
            fallback "非 PR 或拿不到 base"
            exit 0
          fi
          if ! python3 scripts/ci_scope.py --base "$BASE_SHA" --github-output >> "$GITHUB_OUTPUT"; then
            fallback "ci_scope 运行失败"
          fi

      # `--verify-hdl` 的 tests/hdl.rs 没有 iverilog 会静默跳过；Linux 装上让真仿真进 CI。
      # 2026-11-11 实测：GitHub runner 的 security.ubuntu.com DNS 会成片失败（exit 100），
      # 一次抖动就红掉所有 PR 的 ubuntu job ⇒ 这里就地重试；4 次都失败仍然判红（不许静默跳过）。
      - name: Install iverilog (Linux)
        if: steps.scope.outputs.only_docs != 'true' && runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          # 2026-11-11 实测：GitHub runner 的 security.ubuntu.com DNS 会成片失败（exit 100），
          # 一次抖动红掉所有 PR。这里给每次 apt 加硬超时（DNS 卡住时快速失败），失败后
          # 把 runner 的镜像清单（apt-mirrors.txt）与 sources 一起切到 azure 官方镜像再试。
          # 全部失败仍判红：iverilog 缺失时 HDL 仿真会静默跳过，按测试面缩水处理，不降级。
          # 镜像里若已预装，直接复用（runner 断网时这是唯一不依赖外网的路径）。
          if command -v iverilog >/dev/null 2>&1; then
            echo "iverilog 已预装：$(command -v iverilog)"
            exit 0
          fi
          install() {
            timeout 120 sudo apt-get update -qq -o Acquire::Retries=1 -o Acquire::http::Timeout=15               && timeout 180 sudo apt-get install -y -qq -o Acquire::Retries=1 -o Acquire::http::Timeout=15 iverilog
          }
          if install; then
            echo "iverilog 安装成功（默认源）"
            exit 0
          fi
          echo "默认源失败，切换 azure 镜像兜底"
          for f in /etc/apt/apt-mirrors.txt /etc/apt/sources.list /etc/apt/sources.list.d/ubuntu.sources; do
            if [ -f "$f" ]; then
              sudo sed -i -E 's|https?://[a-z0-9.]*ubuntu\.com|http://azure.archive.ubuntu.com|g' "$f" || true
            fi
          done
          for attempt in 1 2 3; do
            if install; then
              echo "iverilog 安装成功（换源第 ${attempt} 次）"
              exit 0
            fi
            echo "换源第 ${attempt} 次仍失败，15s 后重试"
            sleep 15
          done
          echo "::error::iverilog 安装失败：Linux 的 HDL 仿真测试会静默跳过，按测试面缩水处理（不降级）"
          exit 1

      - name: Check formatting
        if: steps.scope.outputs.only_docs != 'true'
        run: cargo fmt --all -- --check

      # args 为空 = 全量：非 PR、改到 workspace 级文件、闭包吃掉大半仓，都走这条路。
      - name: Clippy
        if: steps.scope.outputs.only_docs != 'true'
        shell: bash
        env:
          SCOPE_ARGS: ${{ steps.crates.outputs.args }}
        run: |
          if [ -n "${SCOPE_ARGS:-}" ]; then
            cargo clippy $SCOPE_ARGS --all-targets --locked -- -D warnings
          else
            cargo clippy --workspace --all-targets --locked -- -D warnings
          fi

      # gpu feature（默认关）不单独跑，CI 就永远碰不到：#149 的事故就是这块代码从没被门编译过
      # （matmul.rs 在内核 feature 后，PR 绿、main 的 macOS 红）。
      #
      # 只跑 1×1×1 冒烟用例：CI 的软件后端（Windows WARP 等）跑完整 matmul
      # （512×4096×512）要十几分钟；而 1×1×1 同样会创建全部 shader module，
      # f16 扩展缺失这类错照样能抓到。完整形状在开发者本机跑。
      #
      # 冒烟在软件后端上是纯运行时间（Windows 实测 263s），与后面的 nextest/doctest/clippy
      # 互不依赖 ⇒ 这里当场编好（编译错误当场判红），用例放到后台跑，job 末尾的「— wait」
      # 收结果、打印日志、按退出码判红。放在 Clippy 之后：fmt/clippy 的快速失败不被 GPU 编译拖慢。
      - name: Test (trit-gpu gpu feature, shader smoke) — start
        if: steps.scope.outputs.only_docs != 'true' && steps.crates.outputs.needs_gpu == 'true'
        shell: bash
        run: |
          set -euo pipefail
          cargo test -p trit-gpu --features gpu --locked --test matmul --no-run
          d=target/gpu-smoke
          rm -rf "$d"
          mkdir -p "$d"
          (
            set +e
            cargo test -p trit-gpu --features gpu --locked --test matmul gpu_reg_matmul_tiny_case
            echo $? > "$d/rc.tmp"
            mv "$d/rc.tmp" "$d/rc"
          ) </dev/null >"$d/log" 2>&1 &
          # 等它过了 cargo 的构建锁、真正开始跑用例再放行：后面的 cargo 命令才不会和它抢锁。
          for _ in {1..300}; do
            if [ -f "$d/rc" ] || grep -qs "Running" "$d/log"; then
              break
            fi
            sleep 1
          done

      - name: Test (nextest)
        if: steps.scope.outputs.only_docs != 'true'
        shell: bash
        env:
          SCOPE_ARGS: ${{ steps.crates.outputs.args }}
        run: |
          if [ -n "${SCOPE_ARGS:-}" ]; then
            cargo nextest run $SCOPE_ARGS --locked
          else
            cargo nextest run --workspace --locked
          fi

      # nextest 不跑 doctest（文档示例也算测试面，不能悄悄丢）。
      - name: Test (doctests)
        if: steps.scope.outputs.only_docs != 'true'
        shell: bash
        env:
          SCOPE_ARGS: ${{ steps.crates.outputs.args }}
        run: |
          # `cargo test -p X --doc` 对**只有 bin target** 的包会直接报
          # "no library targets found"（如 trit-redteam），一旦它被 changed-scope
          # 选中，整条 job 就红。此时退化为全量 doctest：真实的文档测试失败会在
          # 全量里重现，不会被吞掉，只是多跑一趟。
          if [ -n "${SCOPE_ARGS:-}" ] && cargo test $SCOPE_ARGS --locked --doc; then
            exit 0
          fi
          echo "::warning::scope 内 doctest 不可用或失败，退化为全量 doctest 复核"
          cargo test --workspace --locked --doc

      # png feature（默认关）：单独测 + clippy，否则 CI 永远碰不到这些代码。
      # 收窄后只在闭包真含 trit-texture 时才跑，否则这条 step 白等一趟编译。
      - name: Test (trit-texture png feature)
        if: steps.scope.outputs.only_docs != 'true' && steps.crates.outputs.needs_png == 'true'
        run: cargo test -p trit-texture --features png --locked
      - name: Clippy (trit-texture png feature)
        if: steps.scope.outputs.only_docs != 'true' && steps.crates.outputs.needs_png == 'true'
        run: cargo clippy -p trit-texture --features png --all-targets --locked -- -D warnings

      # gpu feature 的 clippy。冒烟用例已在 Clippy 后的「— start」放到后台，结果由 job 末尾的「— wait」收。
      - name: Clippy (trit-gpu gpu feature)
        if: steps.scope.outputs.only_docs != 'true' && steps.crates.outputs.needs_gpu == 'true'
        run: cargo clippy -p trit-gpu --features gpu --all-targets --locked -- -D warnings

      # parts-3d 是 required-features = ["gpu"]：--workspace --all-targets 会整块跳过它，
      # meshtex 里 light::… 这类只在 gpu 下编的路径从来没有进过 CI。单独 check 一遍。
      # gpu 的 dep 是 wgpu/pollster/bytemuck，不在 trit-gpu 闭包里，needs_gpu 抓不到，这里不走门控。
      - name: Check (trit-parts gpu feature, parts-3d bin)
        if: steps.scope.outputs.only_docs != 'true'
        run: cargo check -p trit-parts --bin parts-3d --features gpu --locked

      # trit-build 的 gpu feature 同样默认关：至少让 WGSL 过 naga 解析/校验；
      # 有 adapter 时 gpu::tests 会再跑真机对拍，没有就跳过（naga 那条仍必跑）。
      - name: Test (trit-build gpu feature, naga shader smoke)
        if: steps.scope.outputs.only_docs != 'true' && runner.os == 'Linux' && steps.crates.outputs.needs_build_gpu == 'true'
        run: "cargo test -p trit-build --features gpu --bin trit-build gpu:: --locked"
      - name: Clippy (trit-build gpu feature)
        if: steps.scope.outputs.only_docs != 'true' && runner.os == 'Linux' && steps.crates.outputs.needs_build_gpu == 'true'
        run: cargo clippy -p trit-build --features gpu --all-targets --locked -- -D warnings

      # 收「— start」放到后台的冒烟结果：日志整段打印，退出码原样判红。后台进程消失、迟迟不写 rc
      # 时靠 timeout-minutes 判红，不会悄悄放过。
      - name: Test (trit-gpu gpu feature, shader smoke) — wait
        if: steps.scope.outputs.only_docs != 'true' && steps.crates.outputs.needs_gpu == 'true'
        shell: bash
        timeout-minutes: 20
        run: |
          set -uo pipefail
          d=target/gpu-smoke
          while [ ! -f "$d/rc" ]; do
            sleep 5
          done
          cat "$d/log"
          exit "$(cat "$d/rc")"

  docs-gates:
    name: docs gates (hygiene / pointers / status)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      # 文档门原先只活在本机命令行里：漏一个索引、断一条链接、行号漂一格，都要等人去跑。
      # 这些门早已全绿（2026-11-15 实测），接进 CI 只是把「知道自己跑了」变成「不跑就红」。
      - name: Docs hygiene self-test (shape + drive-path counterexamples)
        run: python3 scripts/docs_hygiene.py --self-test
      - name: Docs hygiene (CHANGELOG shape, no new machine paths)
        run: python3 scripts/docs_hygiene.py
      - name: Doc pointers self-test (dead links / unindexed docs counterexamples)
        run: python3 scripts/doc_pointers.py --self-test
      - name: Doc pointers (line refs + link targets + index coverage)
        run: python3 scripts/doc_pointers.py
      - name: Model status self-test
        run: python3 scripts/model_status.py --self-test
      - name: Model status (completion table matches code)
        run: python3 scripts/model_status.py
      - name: Claims evidence self-test (ratchet + counterexamples)
        run: python3 scripts/claims_evidence.py --self-test
      - name: Claims evidence (capability sentences carry proof)
        run: python3 scripts/claims_evidence.py
      - name: Layers self-test (positive + counterexamples)
        run: python3 scripts/layers.py --self-test
      - name: Layers (every crate placed, dependencies point down)
        run: python3 scripts/layers.py
      - name: Handoff snapshot self-test (sanitizer + missing-file counterexamples)
        run: python3 scripts/sync_handoff_snapshot.py --self-test
      - name: Tech collide self-test (positive + counterexamples)
        run: python3 scripts/tech_collide.py --self-test
      # 读的是仓内脱敏快照 scripts/ledger-snapshot/（正本在仓外，CI 上没有）。
      # 快照缺失 ⇒ 判红，不跳过：不知道有没有重复登记不等于没重复。
      - name: Tech collide (ledger ids unique)
        run: python3 scripts/tech_collide.py
      # 用户口径（2026-11-19）：所有仓库禁止 AI 厂商账号/身份进入——只拦归属与来源
      # （URL / 邮箱 / trailer / remote），不拦「一般性提到 AI」。
      - name: AI vendor self-test (URL / email / trailer / remote counterexamples)
        run: python3 scripts/ai_vendor_scan.py --self-test
      - name: AI vendor scan (no vendor URLs / trailers / identities)
        run: python3 scripts/ai_vendor_scan.py

  module-budget:
    name: module budget (god objects)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Gate self-test (positive + counterexamples)
        run: python3 scripts/module_budget.py --self-test
      - name: Every file within budget (default ratchet, whole repo)
        run: python3 scripts/module_budget.py
      - name: Disk guard self-test (signal merge + size classes)
        run: python3 scripts/disk_guard.py --self-test
      # 观测轮：虚拟化层会把固态报成机械盘（WSL2 的 /dev/sdd 实测 rotational=1），
      # runner 上报什么还没有证据 ⇒ 先只打印读数，拿到一轮真实结果再改成阻塞。
      - name: Disk guard (build/test scratch off spinning disks)
        run: python3 scripts/disk_guard.py --json
        continue-on-error: true

  agent-checks:
    name: agent checks (registry)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      # 机制自测：scope 失配判红、台账断链判红、规则字面串不当正则。
      - name: Registry self-test
        run: bash tools/checks.sh selftest
      # C001–C009 的 fast 层。任何 scope 匹配不到文件都判 FAIL，所以文件被拆分或
      # 改名而注册表没跟上时，这里先红 —— 不必等人本地跑一遍才发现（#531 就是这么来的）。
      # `-Ci` 跳过 local_only 的检查（它们的 scope 指向仓库外的本机文件）。
      - name: Registry checks (fast tier)
        run: bash tools/checks.sh run -Ci
      # audit：台账每一条都必须指回已注册的 Cxxx，否则判红。
      - name: Registry audit (prose must point at a registered check)
        run: bash tools/checks.sh audit

  release-preflight:
    name: release preflight (self-test)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Release preflight self-test
        run: python3 scripts/release_preflight.py --self-test

  hazard:
    name: hazard gate (concurrency/memory)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Gate self-test (positive + counterexamples)
        run: python3 scripts/hazard_gate.py --self-test
      - name: Concurrency/memory hazards within the design policy
        run: python3 scripts/hazard_gate.py

  mutation-gate:
    name: mutation gate (self-test)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      # 门的判定链自身也要有人盯：编译红当抓住、崩溃当断言、脚本落 cargo、空集放行
      - name: Gate self-test (verdicts / runner inference / empty selection)
        run: python3 scripts/mutation_check.py --self-test

  snapshot:
    name: snapshot (self-test)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      # 回退底座按字节还原、dry-run 不改文件、不清新文件、对象被篡改要报错
      - name: Snapshot self-test (save / verify / restore / prune)
        run: python3 scripts/snapshot.py --self-test
      # 一条命令 = 先快照、失败自动回退（含删掉命令新建的文件）
      - name: Autoflow self-test (run / auto-restore / keep-on-fail)
        run: python3 scripts/autoflow.py --self-test
      # 一句话提交 GitHub：密钥/敏感文件拒收、显式点名文件、dry-run 只打印
      - name: Gitflow self-test (secret scan / explicit files / dry-run plan)
        run: python3 scripts/gitflow.py --self-test

  deps:
    name: deps plan (self-test)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      # 「能不能整块摘出去」的判据：继承字段 / 内部依赖 / 内部 dev / 越界引用 / build.rs
      - name: Dependency detach self-test
        run: python3 scripts/deps.py --self-test

  vendor:
    name: vendor (self-test)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      # 离线自足开关的配置拼接/还原：重复 save 不重复插段、restore 优先按备份、备份只做一次
      - name: Vendor config splice self-test
        run: python3 scripts/vendor.py --self-test

  secret-scan:
    name: secret scan (repo-wide)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Self-test (patterns / binary skip / allow marker)
        run: python3 scripts/secret_scan.py --self-test
      # 与 GitHub push protection 互补：合成夹具用 `secret-scan: allow` 显式豁免
      - name: Scan repository for high-confidence secrets
        run: python3 scripts/secret_scan.py

  privacy:
    name: privacy (public tree)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Self-test (user path / task doc / data file / ratchet)
        run: python3 scripts/privacy_scan.py --self-test
      # 与 secret scan 正交：那边认密钥形态，这边认内容性质（任务文档/本机路径/数据产物）
      - name: Scan tracked tree for private material
        run: python3 scripts/privacy_scan.py

  ci-integrity:
    name: ci integrity (protection ↔ workflows)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Self-test (typo / push-only / if-guard)
        run: python3 scripts/ci_integrity.py --self-test
      # 拼错的必需检查 = 永久卡死；只在 push 触发的 job 设成必需 = PR 永远等不到
      - name: Required checks match workflow jobs
        run: python3 scripts/ci_integrity.py

  surface:
    name: test surface (ratchet)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      # 每条规则都要有真的会红的反证：空壳 #[test]、裸 #[ignore]、空 self_test、棘轮
      - name: Self-test (hollow tests / bare ignore / ratchet)
        run: python3 scripts/test_surface.py --self-test
      # 台账棘轮：删测试不会让任何别的手段变红，所以在这里拦
      - name: Repo test surface
        run: python3 scripts/test_surface.py
      # 绿即合之前的证据审计：必需检查 skipped / 压根没上报 / run 里 0 个 job 都判红
      - name: Green audit self-test (execution evidence)
        run: python3 scripts/green_audit.py --self-test

  alloc-guard:
    name: alloc guard (limits enforcement)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      # 每条规则都要有真的会红的反证：死帽 / 无界读 / 无界分配 / 豁免要理由 / 读不到判红
      - name: Self-test (dead-cap / unbounded-read / fallible-alloc)
        run: python3 scripts/alloc_guard.py --self-test
      # 审计 U-1/U-2/U-3 那类「上限不执法」的静态门：定义了没人用的帽、不带 take 的流式读
      - name: Repo alloc guard
        run: python3 scripts/alloc_guard.py

  flake:
    name: flake ledger (self-test)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      # 重跑掩盖 + 隔离台账（owner/理由/到期/复验）的判定链反证
      - name: Flake ledger self-test
        run: python3 scripts/flake_ledger.py --self-test
      # 离线只审台账本身：查 API 要 token，这一步保证"台账不合规"当天就红
      - name: Quarantine ledger audit
        run: python3 scripts/flake_ledger.py ledger

  wiring:
    name: secret wiring (self-test)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      # 引用解析 / 环境归属 / 外部声明格式的反证
      - name: Secret wiring self-test
        run: python3 scripts/secret_wiring.py --self-test
      # 真对账需要能列本仓 secrets：本组织的 GITHUB_TOKEN 上限是"只读仓库内容"，
      # job 级 `actions: read` 抬不上去（实测 CI 报"取不到密钥/变量清单"⇒ 门按口径判红，
      # 那个红是对的，但在 CI 里它证明不了任何接线面）。所以：
      #   - CI 跑静态面（引用解析 / 环境归属 / 外部声明格式），并公示没跟线上对过账；
      #   - 线上对账在本地带 PAT 跑，或以后加一条用仓库 secret 的定时流（那才是它真正的用武之地）。
      - name: Wiring static surface (offline)
        run: python3 scripts/secret_wiring.py --offline

  budget:
    name: ci budget (self-test)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      # 静态面（workflow 缺 concurrency / job 缺 timeout / 台账无理由）的反证
      - name: CI budget self-test
        run: python3 scripts/ci_budget.py --self-test
      # 线上耗时对账要 runs 清单；GITHUB_TOKEN 抬不到那个权限，所以 CI 只跑能证明的部分并公示
      - name: CI budget static audit
        run: python3 scripts/ci_budget.py --offline

  recovery:
    name: oops recovery (self-test)
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      # 找回链路全在临时仓里跑：reflog/fsck/stash 三路取证 + "先快照再建分支、不动 HEAD"
      - name: oops self-test
        run: python3 scripts/oops.py --self-test
      # 回收判据（PR 已合 + 干净 + tip 对得上）与外置 target 的删除边界：只删同名、未共用、在树外的绝对路径
      - name: Worktree guard self-test (reclaim rules / external target)
        run: python3 scripts/worktree_guard.py --self-test

  forensics:
    name: merge forensics (self-test)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      # 夹具现造真仓库真冲突：整块取一边、文件没了、算不出 merge-base 都要判红
      - name: Merge forensics self-test (dropped side / vanished file)
        run: python3 scripts/merge_forensics.py --self-test

  stress:
    name: stress (high pressure invariants)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: ${{ hashFiles('Cargo.toml') }}
      - name: Extreme vectors, word boundaries, large random payloads
        run: cargo test --release --locked -p trit-dot -p trit-codec -p trit-float -p trit-gpu --tests

  publish-graph:
    name: publish graph (no dep on unpublished crates)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Gate self-test (positive + counterexamples)
        run: python3 scripts/publish_graph.py --self-test
      - name: Dependency direction and publish metadata
        run: python3 scripts/publish_graph.py

  docs:
    name: docs (rustdoc -D warnings)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: ${{ hashFiles('Cargo.toml') }}
      - name: Rustdoc
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --no-deps --locked

  action:
    name: action (self-test)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Run the reusable action against the example policy
        uses: ./action
        with:
          policy: examples/policy.json
          engine: sat

  msrv:
    name: MSRV (1.88)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      # 与 check job 同一把尺子（scripts/ci_scope.py）：PR 只编/测直改 crate 的反向依赖闭包，
      # 只改文档/脚本的 PR 不编；push main、拿不到 base、ci_scope 出错一律全量。
      - name: Scope crates (PR only)
        id: crates
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -uo pipefail
          if [ "$EVENT" = "pull_request" ] && [ -n "${BASE_SHA:-}" ] \
            && python3 scripts/ci_scope.py --base "$BASE_SHA" --github-output >> "$GITHUB_OUTPUT"; then
            exit 0
          fi
          { echo "args="; echo "only_docs=false"; } >> "$GITHUB_OUTPUT"
          echo "收窄不可用，走全量"
      - uses: dtolnay/rust-toolchain@360a4e93673de6630fac2478bc9e35244b01a759 # 1.88
        if: steps.crates.outputs.only_docs != 'true'
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        if: steps.crates.outputs.only_docs != 'true'
        with:
          key: ${{ hashFiles('Cargo.toml') }}
      - name: Build
        if: steps.crates.outputs.only_docs != 'true'
        shell: bash
        env:
          SCOPE_ARGS: ${{ steps.crates.outputs.args }}
        run: |
          if [ -n "${SCOPE_ARGS:-}" ]; then
            cargo build $SCOPE_ARGS --locked
          else
            cargo build --workspace --locked
          fi
      - name: Test
        if: steps.crates.outputs.only_docs != 'true'
        shell: bash
        env:
          SCOPE_ARGS: ${{ steps.crates.outputs.args }}
        run: |
          if [ -n "${SCOPE_ARGS:-}" ]; then
            cargo test $SCOPE_ARGS --locked
          else
            cargo test --workspace --locked
          fi

  package:
    name: package (publishable)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: ${{ hashFiles('Cargo.toml') }}
      - name: Package every publishable crate (no build)
        run: python3 scripts/package_publishable.py

  wasm:
    name: wasm (wasm32 build)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: ${{ hashFiles('Cargo.toml') }}
      - run: cargo build -p trit-wasm --target wasm32-unknown-unknown --locked
