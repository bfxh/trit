name: agent-quality

# Developer-facing gate.  It intentionally runs on pull requests that touch
# the agent work surface, not on every commit: the gate is deterministic but
# installing openpyxl on hosted runners is still a real, avoidable cost.
#
# End users do not see this workflow, its job names, receipts or fixtures.
# Release assets are filtered separately in release.yml.

on:
  pull_request:
    branches: ["main"]
    paths:
      - "tools/work_bench.py"
      - "tools/cmd_driver.py"
      - "tools/selftest.ps1"
      - "scripts/agent_quality_gate.py"
      - "testdata/work-bench/**"
      - ".github/workflows/agent-quality.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: agent-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  agent-quality:
    name: work-bench + PTC (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Install native XLSX dependency
        run: python -m pip install "openpyxl==3.1.5"

      # One wrapper command runs cmd_driver -SelfTest plus the four-step PTC
      # plan (work-bench preflight, 182/182 self-test, 81/81 + 20/20 run,
      # repeat).  The receipt and reports stay in artifacts/ for debugging.
      - name: Agent quality gate
        run: python scripts/agent_quality_gate.py --out artifacts/agent-quality-gate.json

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: agent-quality-${{ matrix.os }}
          path: artifacts/
          if-no-files-found: warn
          retention-days: 7
