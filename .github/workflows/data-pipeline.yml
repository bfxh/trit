name: data-pipeline

on:
  schedule:
    # 每周一 03:00 UTC（本机时区 +08:00 的周一 11:00）
    - cron: "0 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: data-pipeline
  cancel-in-progress: false

jobs:
  pipeline:
    name: repo 管线 + 轨迹 gate→rewrite→mix → 数据卡
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      # 恢复上一次的产物目录作为基线：有基线才会生成 changes.json
      - name: 恢复基线
        uses: actions/cache/restore@v4
        with:
          path: data-pipeline-out
          key: data-pipeline-${{ github.run_id }}
          restore-keys: data-pipeline-

      - name: 构建 trit-data
        run: cargo build --release -p trit-data --bin trit-data

      - name: 跑管线（对比基线并提升）
        run: ./target/release/trit-data pipeline --config .github/data-pipeline.json --out data-pipeline-out --promote

      - name: 跑轨迹管线（gate → rewrite → mix）
        run: |
          ./target/release/trit-data pipeline \
            --trajectories crates/trit-data/testdata/trajectories.jsonl \
            --out data-pipeline-out/trajectories \
            --no-lang-quality \
            --cmd "sed s/^/first/" \
            --mix-total 2

      - name: 摘要
        run: |
          echo '### data-pipeline' >> "$GITHUB_STEP_SUMMARY"
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          cat data-pipeline-out/batch.report.json >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo '#### 轨迹管线' >> "$GITHUB_STEP_SUMMARY"
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          cat data-pipeline-out/trajectories/trajectory.pipeline.report.json >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          for f in data-pipeline-out/*/changes.json; do
            [ -f "$f" ] || continue
            echo "#### $f" >> "$GITHUB_STEP_SUMMARY"
            echo '```json' >> "$GITHUB_STEP_SUMMARY"
            cat "$f" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          done

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: data-pipeline
          path: data-pipeline-out
          retention-days: 30

      - name: 保存基线
        uses: actions/cache/save@v4
        with:
          path: data-pipeline-out
          key: data-pipeline-${{ github.run_id }}
