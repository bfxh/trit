name: mutation

on:
  workflow_dispatch:
  schedule:
    - cron: "0 4 * * 1"
  pull_request:

permissions:
  contents: read

# 同一 PR 的新 push 立即取消旧的变异门运行（被顶掉的结果无价值）；
# 定时/手动运行用唯一 run_id 分组，互不干扰。
concurrency:
  group: mutation-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.number) || format('run-{0}', github.run_id) }}
  cancel-in-progress: true

jobs:
  changed:
    name: mutation (changed crates)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: Collect changed crates
        id: crates
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          files=$(git diff --name-only "$BASE_SHA"...HEAD -- 'crates/**')
          pkgs=$(printf '%s\n' "$files" | awk -F/ 'NF > 1 && $1 == "crates" { print $2 }' | sort -u)
          # 门脚本（python 语言面）也算一个可选目标：脚本路径本身就是 `--pkg` 的值
          scripts=$(git diff --name-only "$BASE_SHA"...HEAD -- 'scripts/**' \
            | grep -E '^scripts/[A-Za-z0-9_.-]+\.py$' \
            | while read -r f; do grep -q -- '--self-test' "$f" 2>/dev/null && echo "$f"; done || true)
          # bash 语言面同理（冒烟脚本带 --self-test 才能登记变异）
          # 字符类要带 `-`/`.`：crate 目录名形如 trit-immune，漏了连字符就一条也收不到
          bsh=$(git diff --name-only "$BASE_SHA"...HEAD -- 'scripts/*.sh' 'crates/*/scripts/*.sh' \
            | grep -E '^(scripts|crates/[A-Za-z0-9_.-]+/scripts)/[A-Za-z0-9_.-]+\.sh$' \
            | while read -r f; do grep -q -- '--self-test' "$f" 2>/dev/null && echo "$f"; done || true)
          # 登记表按目标拆成 scripts/mutants/<目标>.json 之后，改 json 就是改那个目标的登记，
          # 要把文件名映射回目标本身（`__` → `/`），否则这个目标的变异一条都不会被重跑。
          jsons=$(git diff --name-only "$BASE_SHA"...HEAD -- 'scripts/mutants/*.json' \
            | sed -E 's#^scripts/mutants/(.*)\.json$#\1#; s#__#/#g' || true)
          pkgs=$(printf '%s\n%s\n%s\n%s\n' "$pkgs" "$scripts" "$bsh" "$jsons" | sed '/^$/d' | sort -u)
          # 靶子消失了就不算「这个目标 0 条变异」：删除型 PR（整仓迁走）里，crate 目录与被删的
          # 登记表路径都还会被 diff 选中，而门对「选中了但 0 条」是 fail-closed 判红 —— 那是一条
          # 根本没东西可跑的靶子，不是漏登记。剔除口径只认 HEAD 上还在的东西：目录/文件任一存在即保留。
          # 反过来，新加的 crate（目录在、登记 0 条）仍会走到门的判红分支，fail-closed 不放松。
          pkgs=$(for p in $pkgs; do
                   if [ -e "$p" ] || [ -e "crates/$p" ]; then printf '%s\n' "$p"; fi
                 done | sort -u)
          # 变异只跑**改动文件**里的条目：大 crate（trit-wspace 328 条）全包跑要 60+ 分钟，
          # 而只有被改过的文件里的变异才可能被这次改动影响；未改文件的变异已由 main 的 CI 验证。
          rust_files=$(git diff --name-only "$BASE_SHA"...HEAD -- 'crates/**' | grep -E '\.rs$' | paste -sd, - || true)
          args=""
          for pkg in $pkgs; do args="$args --pkg $pkg"; done
          if [ -n "$rust_files" ]; then args="$args --files $rust_files"; fi
          echo "args=$args" >> "$GITHUB_OUTPUT"
          echo "changed crates: ${pkgs:-none}"
      - name: Mutation gate (changed crates only)
        if: steps.crates.outputs.args != ''
        run: python3 scripts/mutation_check.py ${{ steps.crates.outputs.args }}

  # full 拆 4 片并行（crc32(file\0name) 稳定分片）：每片一个独立检出（同树有单实例锁与共享文件）。
  # 聚合 job 保持原名 "mutation (full)"：它不在 required-checks.txt 里（只有 dispatch/schedule 跑），
  # 但名字不变，历史读数与任何外部引用仍对得上。required 的两个名字（self-test / changed crates）不动。
  full-shard:
    name: mutation (full shard ${{ matrix.shard }}/4)
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: mutation gate (shard ${{ matrix.shard }}/4)
        run: python3 scripts/mutation_check.py --shard ${{ matrix.shard }}/4 2>&1 | tee "shard-${{ matrix.shard }}.log"
      - name: upload shard log
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mutation-shard-${{ matrix.shard }}
          path: shard-${{ matrix.shard }}.log

  full:
    name: mutation (full)
    # always()：某片红了也要跑聚合——日志里的 SURVIVED/缺条目会被逐条点名，
    # 而不是让聚合 job 静默 skipped（"没跑"不等于"过了"）。
    if: always() && github.event_name != 'pull_request'
    needs: full-shard
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: mutation-shard-*
          path: shard-logs
          merge-multiple: true
      - name: aggregate (partition + per-mutant coverage)
        run: python3 scripts/mutation_check.py --partition 4 --logs shard-logs
