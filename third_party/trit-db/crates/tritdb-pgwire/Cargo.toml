[package]
name = "tritdb-pgwire"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
description = "Minimal PostgreSQL wire protocol server for trit-db"

[dependencies]
tritdb-cas.workspace = true
tritdb-exec.workspace = true
tritdb-sql.workspace = true
base64 = "0.22"
getrandom = "0.3"
md-5 = "0.11"
rustls = { version = "0.23", default-features = false, features = ["std", "ring"] }
rustls-pemfile = "2"
webpki-roots = "1"
x509-parser = { version = "0.18.1", features = ["verify"] }
x509-ocsp = "0.2.1"
der = "0.7"
encoding_rs = "0.8"
const-oid = "0.9"
sha1 = "0.10"
spki = "0.7"
x509-cert = "0.2"

[dev-dependencies]
rcgen = "0.13"
ring = "0.17"

[lints]
workspace = true
