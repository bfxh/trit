[package]
name = "wsp-no-transformer"
version = "0.1.0"
edition = "2024"
publish = false

# 独立 workspace：复现 alphaXiv《Weight-Space Programming Doesn't Need Transformers》
# 的稀疏事实表读取器（mem_assoc2），不进主 workspace、不进 CI。
[workspace]

[dependencies]
npyz = "0.8"
wgpu = "30"
pollster = "0.4"
bytemuck = { version = "1", features = ["derive"] }
# npz 本身就是装了 `.npy` 的 zip：这里自己读容器，不用 npyz 的 `npz` feature。
# 那个 feature 把 zip 钉在 0.6.x，命中 GHSA-m665-v7pm-7grj（critical，修复 9.0.5）
# 与 GHSA-8hxf-qr8p-62x4（medium，修复 9.0.0）；`.npy` 解析仍交给 npyz。
zip = { version = "9", default-features = false, features = ["deflate-flate2-zlib-rs"] }
