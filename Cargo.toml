[workspace]
resolver = "3"
# cargo-fuzz 需要 nightly 与独立 target，不并入 workspace。
exclude = ["fuzz", "t3", "benchmarks/dot_variants"]
members = [
    "crates/trit-bench",
    "crates/trit-fuzz",
    "crates/trit-core",
    "crates/trit-learn",
    "crates/trit-graph",
    "crates/trit-gamescan",
    "crates/trit-train",
    "crates/trit-lsp",
    "crates/trit-eval",
    "crates/trit-sat",
    "crates/trit-count",
    "crates/trit-mv",
    "crates/trit-mmap",
    "crates/trit-simd",
    "crates/trit-num",
    "crates/trit-export",
    "crates/trit-ir",
    "crates/trit-clean",
    "crates/trit-circuit",
    "crates/trit-cli",
    "crates/trit-build",
    "crates/trit-redteam",
    "crates/trit-bdd",
    "crates/trit-policy",
    "crates/trit-belnap",
    "crates/trit-wasm",
    "crates/sansheng",
    "crates/trit-schedule",
    "crates/trit-net",
    "crates/trit-parts",
    "crates/trit-machines",
    "crates/trit-codec",
    "crates/trit-attn",
    "crates/trit-float",
    "crates/trit-dot",
    "crates/trit-gpu",
    "crates/trit-texture",
    "crates/trit-unsafe",
    "crates/trit-procscan",
    "crates/trit-ops",
    "crates/trit-capacity",
    "crates/trit-re",
    "crates/trit-immune",
    "crates/trit-orch",
    "crates/trit-wspace",
]

[workspace.package]
version = "0.12.0"
edition = "2024"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
repository = "https://github.com/bfxh/trit"

[workspace.dependencies]
trit-core = { path = "crates/trit-core", version = "0.12.0" }
trit-capacity = { path = "crates/trit-capacity", version = "0.12.0" }
trit-learn = { path = "crates/trit-learn", version = "0.12.0" }
trit-eval = { path = "crates/trit-eval", version = "0.12.0" }
trit-sat = { path = "crates/trit-sat", version = "0.12.0" }
trit-circuit = { path = "crates/trit-circuit", version = "0.12.0" }
trit-bdd = { path = "crates/trit-bdd", version = "0.12.0" }
trit-bench = { path = "crates/trit-bench", version = "0.12.0" }
trit-fuzz = { path = "crates/trit-fuzz", version = "0.12.0" }
trit-count = { path = "crates/trit-count", version = "0.12.0" }
trit-policy = { path = "crates/trit-policy", version = "0.12.0" }
trit-belnap = { path = "crates/trit-belnap", version = "0.12.0" }
trit-codec = { path = "crates/trit-codec", version = "0.12.0" }
trit-export = { path = "crates/trit-export", version = "0.12.0" }
trit-wasm = { path = "crates/trit-wasm", version = "0.12.0" }
sansheng = { path = "crates/sansheng", version = "0.12.0" }
trit-schedule = { path = "crates/trit-schedule", version = "0.12.0" }
trit-orch = { path = "crates/trit-orch", version = "0.12.0" }
trit-wspace = { path = "crates/trit-wspace", version = "0.12.0" }
trit-gamescan = { path = "crates/trit-gamescan", version = "0.12.0" }
